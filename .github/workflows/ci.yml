name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: git ls-files '*.js' '*.mjs' '*.cjs' | tr '\n' '\0' | xargs -0 -n1 node --check
      - name: Test every lesson on its own
        run: |
          for lesson in [0-9][0-9][0-9]-*/; do
            (
              cd "$lesson" && npm ci
              # apps that load lit-html / page from their own node_modules
              find . -mindepth 2 -maxdepth 2 -name package.json -not -path "*/node_modules/*" -execdir npm install \;
              npm test
            ) || exit 1
          done
