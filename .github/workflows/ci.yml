name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: git ls-files '*.js' '*.mjs' '*.cjs' | tr '\n' '\0' | xargs -0 -n1 node --check
      - run: npm test
